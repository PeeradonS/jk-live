name: Deploy JK Live

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment repo
        uses: actions/checkout@v4

      - name: Mirror current public JK production
        run: |
          rm -rf mirror site
          mkdir -p mirror site
          wget --mirror --page-requisites --adjust-extension --no-parent \
            --domains jk-jerkan-preview.netlify.app \
            --directory-prefix mirror \
            https://jk-jerkan-preview.netlify.app/ || test -f mirror/jk-jerkan-preview.netlify.app/index.html
          cp -R mirror/jk-jerkan-preview.netlify.app/. site/
          rm -rf site/.netlify

      - name: Apply latest JK production patches
        run: |
          mkdir -p site/patches
          cp -R patches/. site/patches/
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('site/index.html')
          s = p.read_text(encoding='utf-8')

          s = re.sub(r'<iframe[^>]+(?:netlify|\.netlify)[^>]*>.*?</iframe>', '', s, flags=re.I|re.S)
          s = re.sub(r'<script[^>]+src=["\'][^"\']*(?:netlify|\.netlify)[^"\']*["\'][^>]*>.*?</script>', '', s, flags=re.I|re.S)

          head_assets = [
              ('sticker-shop-v62.css', '<link rel="stylesheet" href="./patches/sticker-shop-v62.css">'),
              ('sticker-v77.css', '<link rel="stylesheet" href="./patches/sticker-v77.css">'),
              ('jk-live-ux-v91.css', '<link rel="stylesheet" href="./patches/jk-live-ux-v91.css">'),
              ('jk-prod-hybrid-v92.css', '<link rel="stylesheet" href="./patches/jk-prod-hybrid-v92.css">'),
              ('jk-prod-ui-v93.css', '<link rel="stylesheet" href="./patches/jk-prod-ui-v93.css?v=93.4">'),
              ('jk-sticker-pro-v100.css', '<link rel="stylesheet" href="./patches/jk-sticker-pro-v100.css?v=100.0">'),
          ]
          body_assets = [
              ('sticker-v77.js', '<script src="./patches/sticker-v77.js"></script>'),
              ('jk-recovery-v90.js', '<script src="./patches/jk-recovery-v90.js"></script>'),
              ('jk-live-ux-v91.js', '<script src="./patches/jk-live-ux-v91.js"></script>'),
              ('jk-prod-ui-v93.js', '<script src="./patches/jk-prod-ui-v93.js?v=93.4"></script>'),
              ('jk-sticker-pro-v100.js', '<script src="./patches/jk-sticker-pro-v100.js?v=100.0"></script>'),
          ]

          for key, tag in head_assets:
              if key not in s:
                  s = s.replace('</head>', tag + '\n</head>')

          for key, tag in body_assets:
              if key not in s:
                  s = s.replace('</body>', tag + '\n</body>')

          p.write_text(s, encoding='utf-8')
          PY
          touch site/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
