name: Deploy JK Live

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment repo
        uses: actions/checkout@v4

      - name: Mirror current public JK production
        run: |
          rm -rf mirror site
          mkdir -p mirror site
          wget --mirror --page-requisites --convert-links --adjust-extension --no-parent \
            --domains jk-jerkan-preview.netlify.app \
            --directory-prefix mirror \
            https://jk-jerkan-preview.netlify.app/
          cp -R mirror/jk-jerkan-preview.netlify.app/. site/

      - name: Apply latest JK production patches
        run: |
          mkdir -p site/patches
          cp -R patches/. site/patches/
          python3 - <<'PY'
          from pathlib import Path
          p = Path('site/index.html')
          s = p.read_text(encoding='utf-8')
          head = '''
          <link rel="stylesheet" href="./patches/sticker-shop-v62.css">
          <link rel="stylesheet" href="./patches/sticker-v77.css">
          <link rel="stylesheet" href="./patches/jk-live-ux-v91.css">
          <link rel="stylesheet" href="./patches/jk-prod-hybrid-v92.css">
          '''
          body = '''
          <script src="./patches/sticker-v77.js"></script>
          <script src="./patches/jk-recovery-v90.js"></script>
          <script src="./patches/jk-live-ux-v91.js"></script>
          '''
          if 'jk-prod-hybrid-v92.css' not in s:
              s = s.replace('</head>', head + '</head>')
          if 'jk-live-ux-v91.js' not in s:
              s = s.replace('</body>', body + '</body>')
          p.write_text(s, encoding='utf-8')
          PY
          touch site/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
