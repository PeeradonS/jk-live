name: Deploy JK Live

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment repo
        uses: actions/checkout@v4

      - name: Validate sticker production JavaScript
        run: |
          node --check patches/jk-sticker-renderer-v101.js
          node --check patches/jk-sticker-picker-v104.js
          node --check patches/jk-sticker-store-v105.js
          node --check patches/sticker-v77.js

      - name: Mirror current public JK production
        run: |
          rm -rf mirror site
          mkdir -p mirror site
          wget --mirror --page-requisites --adjust-extension --no-parent \
            --domains jk-jerkan-preview.netlify.app \
            --directory-prefix mirror \
            https://jk-jerkan-preview.netlify.app/ || test -f mirror/jk-jerkan-preview.netlify.app/index.html
          cp -R mirror/jk-jerkan-preview.netlify.app/. site/
          rm -rf site/.netlify

      - name: Apply latest JK production patches
        run: |
          mkdir -p site/patches
          cp -R patches/. site/patches/
          cp patches/sticker-v77.js site/sticker-v77.js
          if [ -d resources ]; then mkdir -p site/resources && cp -R resources/. site/resources/; fi
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('site/index.html')
          s = p.read_text(encoding='utf-8')

          s = re.sub(r'<iframe[^>]+(?:netlify|\.netlify)[^>]*>.*?</iframe>', '', s, flags=re.I|re.S)
          s = re.sub(r'<script[^>]+src=["\'][^"\']*(?:netlify|\.netlify)[^"\']*["\'][^>]*>.*?</script>', '', s, flags=re.I|re.S)
          s = s.replace('src="./sticker-v77.js"', 'src="./sticker-v77.js?v=77.3"')

          head_assets = [
              ('sticker-shop-v62.css', '<link rel="stylesheet" href="./patches/sticker-shop-v62.css">'),
              ('sticker-v77.css', '<link rel="stylesheet" href="./patches/sticker-v77.css">'),
              ('jk-live-ux-v91.css', '<link rel="stylesheet" href="./patches/jk-live-ux-v91.css">'),
              ('jk-prod-hybrid-v92.css', '<link rel="stylesheet" href="./patches/jk-prod-hybrid-v92.css">'),
              ('jk-prod-ui-v93.css', '<link rel="stylesheet" href="./patches/jk-prod-ui-v93.css?v=93.4">'),
              ('jk-sticker-picker-v104.css', '<link rel="stylesheet" href="./patches/jk-sticker-picker-v104.css?v=104.5">'),
              ('jk-sticker-store-v105.css', '<link rel="stylesheet" href="./patches/jk-sticker-store-v105.css?v=105.4">'),
          ]
          body_assets = [
              ('sticker-v77.js', '<script src="./patches/sticker-v77.js"></script>'),
              ('jk-recovery-v90.js', '<script src="./patches/jk-recovery-v90.js"></script>'),
              ('jk-live-ux-v91.js', '<script src="./patches/jk-live-ux-v91.js"></script>'),
              ('jk-prod-ui-v93.js', '<script src="./patches/jk-prod-ui-v93.js?v=93.4"></script>'),
              ('jk-sticker-picker-v104.js', '<script src="./patches/jk-sticker-picker-v104.js?v=104.5"></script>'),
              ('jk-sticker-store-v105.js', '<script src="./patches/jk-sticker-store-v105.js?v=105.4"></script>'),
          ]

          for key, tag in head_assets:
              if key not in s:
                  s = s.replace('</head>', tag + '\n</head>')

          for key, tag in body_assets:
              if key not in s:
                  s = s.replace('</body>', tag + '\n</body>')

          # Always normalize Sticker Picker cache versions even when mirrored HTML already contains the tag.
          s = re.sub(r'(jk-sticker-picker-v104\.css)(?:\?v=[^"\']*)?', r'\1?v=104.5', s)
          s = re.sub(r'(jk-sticker-picker-v104\.js)(?:\?v=[^"\']*)?', r'\1?v=104.5', s)
          s = re.sub(r'(jk-sticker-store-v105\.css)(?:\?v=[^"\']*)?', r'\1?v=105.4', s)
          s = re.sub(r'(jk-sticker-store-v105\.js)(?:\?v=[^"\']*)?', r'\1?v=105.4', s)

          s = re.sub(r'<style id="jk-sticker-pro-v100">.*?</style>', '', s, flags=re.I|re.S)
          s = re.sub(r'<script id="jk-sticker-pro-v100">.*?</script>', '', s, flags=re.I|re.S)
          s = re.sub(r'<style id="jk-sticker-renderer-v101">.*?</style>', '', s, flags=re.I|re.S)
          s = re.sub(r'<script id="jk-sticker-renderer-v101">.*?</script>', '', s, flags=re.I|re.S)

          sticker_css = Path('site/patches/jk-sticker-renderer-v101.css').read_text(encoding='utf-8')
          sticker_js = Path('site/patches/jk-sticker-renderer-v101.js').read_text(encoding='utf-8')
          s = s.replace('</head>', '<style id="jk-sticker-renderer-v101">' + sticker_css + '</style>\n</head>')
          s = s.replace('</body>', '<script id="jk-sticker-renderer-v101">' + sticker_js.replace('</script>', '<\\/script>') + '</script>\n</body>')

          if 'JK_STICKER_RENDERER_V101' not in s:
              raise SystemExit('Sticker Renderer v101 was not embedded into production HTML')

          # STEP 9: extend the existing message long-press menu for sticker messages.
          helper_anchor = '        function bindMessageLongPressV36(root) {'
          if 'function stickerFavoriteIdV106(msg)' not in s:
              helper = """        function stickerFavoriteIdV106(msg) {
          if (!msg || String(msg.message_type || '') !== 'sticker' || !msg.sticker_key) return '';
          return String(msg.sticker_pack || '') + '|' + String(msg.sticker_key || '');
        }
        function isStickerFavoriteV106(msg) {
          const key = stickerFavoriteIdV106(msg);
          const picker = window.JKStickerPickerV104;
          return !!key && Array.isArray(picker?.favorites?.()) && picker.favorites().includes(key);
        }
        function toggleStickerFavoriteV106(msg) {
          if (!stickerFavoriteIdV106(msg) || !window.JKStickerPickerV104?.toggleFav) return false;
          const before = isStickerFavoriteV106(msg);
          window.JKStickerPickerV104.toggleFav(String(msg.sticker_pack || ''), String(msg.sticker_key || ''));
          return !before;
        }
        function resendStickerV106(msg) {
          closeModal();
          const send = window.JKStickerV77?.sendByKey;
          if (!send || !msg?.sticker_pack || !msg?.sticker_key) return toast('ยังส่งสติ๊กเกอร์นี้ไม่ได้');
          Promise.resolve(send(msg.sticker_pack, msg.sticker_key)).then(ok => { if (!ok) toast('ยังส่งสติ๊กเกอร์นี้ไม่ได้'); });
        }
        function bindMessageLongPressV36(root) {"""
              i = s.rfind(helper_anchor)
              if i < 0: raise SystemExit('STEP9 bindMessageLongPressV36 anchor missing')
              s = s[:i] + helper + s[i+len(helper_anchor):]

          a = s.rfind('        function openMessageInteractV28(id) {')
          b = s.find('\n        function toggleReactionV28', a)
          if a < 0 or b < 0: raise SystemExit('STEP9 message interaction boundary missing')
          block = s[a:b]
          if 'favoriteStickerV106' not in block:
              block = block.replace(
                  '          const mine = msg.sender_id === state.user.id;',
                  """          const mine = msg.sender_id === state.user.id,
            stickerMsg = String(msg.message_type || '') === 'sticker' && !!msg.sticker_key;""",
                  1
              )
              marker = "          $('[data-react-v28]', modalRoot()).forEach("
              inject = """          if (stickerMsg) {
            const list = $('.menu-list', modalRoot());
            const before = $('#manageOwnMessageV28', modalRoot());
            const add = (id, title, detail, tail, action) => {
              const btn = document.createElement('button');
              btn.className = 'menu-item';
              btn.id = id;
              const left = document.createElement('span');
              left.textContent = title;
              const small = document.createElement('small');
              small.textContent = detail;
              left.appendChild(small);
              const right = document.createElement('span');
              right.textContent = tail;
              btn.append(left, right);
              list?.insertBefore(btn, before || null);
              btn.onclick = action;
              return btn;
            };
            const fav = isStickerFavoriteV106(msg);
            add('favoriteStickerV106', fav ? 'เอาออกจากรายการโปรด' : 'เพิ่มไปที่รายการโปรด', fav ? 'ลบจากรายการโปรดของสติ๊กเกอร์' : 'หยิบใช้ซ้ำได้เร็วจากตัวเลือกสติ๊กเกอร์', fav ? '★' : '☆', () => {
              const added = toggleStickerFavoriteV106(msg);
              closeModal();
              toast(added ? 'เพิ่มสติ๊กเกอร์นี้ไปที่โปรดแล้ว' : 'เอาสติกเกอร์นี้ออกจากโปรดแล้ว');
            });
            add('resendStickerV106', 'ส่งสติ๊กเกอร์นี้อีกครั้ง', 'ไม่ต้องไล่หาจากทั้งแพ็ก', '›', () => resendStickerV106(msg));
          }
"""
              if marker not in block: raise SystemExit('STEP9 reaction binding marker missing')
              block = block.replace(marker, inject + marker, 1)
              s = s[:a] + block + s[b:]

          if 'function runStickerInteractionQaV106()' not in s:
              qa_anchor = '        function toggleReactionV28(id, emoji) {'
              qa = """        function runStickerInteractionQaV106() {
          if (new URLSearchParams(location.search).get('stickerQaStep9') !== '1') return;
          const run = () => {
            if (!state?.user || !state?.messages) return setTimeout(run, 120);
            const fake = { id:'jk-step9-qa', sender_id:state.user.id, message_type:'sticker', sticker_pack:'v62_31', sticker_key:'v65_v62_31_01', sticker_text:'หวัดดีครับ', body:'[Sticker] หวัดดีครับ', created_at:new Date().toISOString() };
            state.messages.push(fake);
            const was = isStickerFavoriteV106(fake);
            openMessageInteractV28(fake.id);
            const root = modalRoot();
            const reply = !!$('#replyMessageV28', root);
            const favorite = !!$('#favoriteStickerV106', root);
            const resend = !!$('#resendStickerV106', root);
            toggleStickerFavoriteV106(fake);
            const changed = isStickerFavoriteV106(fake) !== was;
            toggleStickerFavoriteV106(fake);
            state.messages = state.messages.filter(x => String(x.id) !== fake.id);
            closeModal();
            const pass = reply && favorite && resend && changed;
            const badge = document.createElement('div');
            badge.id = 'jkStep9Qa';
            badge.textContent = pass ? 'JK STICKER STEP 9 · PASS · long press + reply + favorite + resend' : 'JK STICKER STEP 9 · FAIL';
            document.body.appendChild(badge);
          };
          setTimeout(run, 180);
        }
        document.addEventListener('DOMContentLoaded', runStickerInteractionQaV106);
        setTimeout(runStickerInteractionQaV106, 500);
        function toggleReactionV28(id, emoji) {"""
              i = s.rfind(qa_anchor)
              if i < 0: raise SystemExit('STEP9 toggleReactionV28 anchor missing')
              s = s[:i] + qa + s[i+len(qa_anchor):]

          for token in ['favoriteStickerV106', 'resendStickerV106', 'JK STICKER STEP 9 · PASS', 'const holdMs = 430', 'replyMessageV28']:
              if token not in s: raise SystemExit('STEP9 missing ' + token)

          p.write_text(s, encoding='utf-8')
          PY
          touch site/.nojekyll

      - name: Browser QA Sticker Store v105
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "No Chrome/Chromium found on runner"
            exit 1
          fi
          python3 -m http.server 8765 >/tmp/jk-store-qa-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --virtual-time-budget=5000 \
            --dump-dom "http://127.0.0.1:8765/tests/sticker-store-v105-qa.html?storeQaStep6=1" \
            >/tmp/jk-store-v105-qa.html
          grep -q "JK STICKER STEP 6 · PASS · browse + search + category + 24 preview" /tmp/jk-store-v105-qa.html

          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --virtual-time-budget=5000 \
            --dump-dom "http://127.0.0.1:8765/tests/sticker-store-v105-qa.html?storeQaStep7=1" \
            >/tmp/jk-store-v105-step7-qa.html
          grep -q "JK STICKER STEP 7 · PASS · account ownership + restore" /tmp/jk-store-v105-step7-qa.html

          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --virtual-time-budget=5000 \
            --dump-dom "http://127.0.0.1:8765/tests/sticker-store-v105-qa.html?storeQaStep8=1" \
            >/tmp/jk-store-v105-step8-qa.html
          grep -q "JK STICKER STEP 8 · PASS · purchase CTA + no fake ownership" /tmp/jk-store-v105-step8-qa.html

          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --virtual-time-budget=5000 \
            --dump-dom "http://127.0.0.1:8765/tests/sticker-store-v105-qa.html?storeQaStep8Off=1&paymentRouteOff=1" \
            >/tmp/jk-store-v105-step8-off-qa.html
          grep -q "JK STICKER STEP 8 OFF · PASS · disabled + honest state" /tmp/jk-store-v105-step8-off-qa.html

          echo "Sticker Store v105 browser QA PASS · STEP 6 + STEP 7 + STEP 8"

          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --virtual-time-budget=6000 \
            --dump-dom "http://127.0.0.1:8765/?preview=1&stickerQaStep9=1" \
            >/tmp/jk-sticker-step9-qa.html
          grep -q "JK STICKER STEP 9 · PASS · long press + reply + favorite + resend" /tmp/jk-sticker-step9-qa.html
          echo "Sticker interaction browser QA PASS · STEP 9"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
