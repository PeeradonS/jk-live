<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JK Sticker Store v105 QA</title>
<link rel="stylesheet" href="../patches/jk-sticker-store-v105.css">
</head>
<body>
<script>
const makePack=(id,title,category,owned,price)=>({
  pack_id:id,title,category,owned,amount_minor:price,
  art_status:'production',sale_ready:true,real_asset_count:24,asset_standard:'JK-512-RGBA-v1',
  items:Array.from({length:24},(_,i)=>({
    sticker_key:id+'_'+String(i+1).padStart(2,'0'),
    caption_th:'คำที่ '+(i+1)
  }))
});
const initialCatalog=[
  makePack('qa_owned','ชุดของฉัน','cute',true,0),
  makePack('qa_paid','ชุดพรีเมียม','pets',false,4900)
];
const restoredCatalog=[
  makePack('qa_owned','ชุดของฉัน','cute',true,0),
  makePack('qa_paid','ชุดพรีเมียม','pets',true,4900)
];
window.__JK_QA_PURCHASE_CALLS=0;
const qaPaymentReady=new URLSearchParams(location.search).get('paymentRouteOff')!=='1';
window.JKStickerV77={
  get paymentReady(){ return qaPaymentReady; },
  get paymentStatus(){ return {platform:'web',provider:qaPaymentReady?'qa_provider':'web_payment',ready:qaPaymentReady}; },
  getCatalog:async()=>initialCatalog.map(p=>({...p,items:p.items.map(i=>({...i}))})),
  loadCatalog:async(force=false)=>(force?restoredCatalog:initialCatalog).map(p=>({...p,items:p.items.map(i=>({...i}))})),
  isOwned:p=>!!p.owned||Number(p.amount_minor||0)===0,
  startPurchaseByPackId:async packId=>{
    window.__JK_QA_PURCHASE_CALLS+=1;
    return {ok:true,started:true,platform:'web',provider:'qa_provider',pack_id:packId};
  },
  artMarkup:(key,cls='')=>'<img class="'+cls+'" alt="'+key+'" src="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%221%22 height=%221%22/%3E">'
};
window.JKStickerPickerV104={close(){},openMinePack:async()=>true};
</script>
<script src="../patches/jk-sticker-store-v105.js"></script>
</body>
</html>
